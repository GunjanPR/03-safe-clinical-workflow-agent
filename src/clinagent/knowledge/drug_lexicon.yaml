# Drug lexicon: canonical ingredient -> classes, brand names and other surface forms.
# Covers every ingredient in the active MedicationRequests of the 5,000-patient Synthea store,
# plus common OTC products and supplements patients report. DEMO DATA - NOT FOR CLINICAL USE.
# Classes drive the therapeutic-duplication rules in clinical_kb.yaml.

